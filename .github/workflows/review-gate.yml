name: Review Gate

# Advisory review gate: branch protection is unavailable on the current plan,
# so this check turns red when a PR lacks an approving review from someone
# other than the author. Convention for all contributors (human or agent):
# never merge while this check is failing.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  pull-requests: read

concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  require-independent-approval:
    runs-on: ubuntu-latest
    steps:
      - name: Require an approving review from a non-author
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          author=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json author --jq '.author.login')
          approvals=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json reviews \
            --jq "[.reviews[] | select(.state == \"APPROVED\" and .author.login != \"$author\")] | length")
          if [ "$approvals" -eq 0 ]; then
            echo "::error::No approving review from a non-author yet. Do not merge while this check is red (see issue #53)."
            exit 1
          fi
          echo "Found $approvals independent approval(s)."
