name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build:offline

      - name: Check
        run: npm run check

      - name: Pi ecosystem compatibility
        run: npm run test:pi-compat

      - name: Test
        run: npm test

  # The main job preinstalls fd/ripgrep, so the downloader's cold path never runs
  # there. This job starts with an empty tool cache and no system fd/rg on PATH,
  # exercising concurrent cold downloads the way fresh installs hit them.
  cold-start-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Cold-start tool download contracts
        env:
          COLD_START_TOOLS: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm --prefix packages/coding-agent run test -- test/tools-manager-cold-start.test.ts
