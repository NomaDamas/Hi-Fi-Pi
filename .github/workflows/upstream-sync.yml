name: Upstream sync rehearsal

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate upstream delta report
        run: npm run upstream:report -- --fetch --output .artifacts/upstream-delta.json

      - name: Build fork
        run: npm run build:offline

      - name: Run legacy compatibility contracts
        run: npm run test:upstream-compat

      - name: Upload rehearsal report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-delta-${{ github.run_id }}
          path: .artifacts/upstream-delta.json
          if-no-files-found: error
