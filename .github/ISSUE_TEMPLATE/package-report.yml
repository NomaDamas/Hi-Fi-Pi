name: Package Compatibility Report
description: Report a Pi package that does not load or behave correctly in Hi-Fi Pi
labels: ["package-report"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for compatibility problems with an existing Pi extension, skill, prompt, or theme package. For Hi-Fi Pi core bugs, use the bug report template instead.

        Include the package source, pinned version or commit, and the smallest reproducible command. Follow this repository's CONTRIBUTING.md.

        Keep this short. If it doesn't fit on one screen, it's too long. Write in your own voice.

  - type: input
    id: package-name
    attributes:
      label: Package name
      description: The npm or git package source.
      placeholder: "@scope/package"
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Version
      description: The exact package version, tag, or commit.
      placeholder: "0.1.0"
    validations:
      required: false

  - type: dropdown
    id: report-type
    attributes:
      label: What are you reporting?
      options:
        - Load or discovery failure
        - Extension runtime failure
        - Skill, prompt, or theme incompatibility
        - Package manager failure
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Describe the concern and include links, logs, or screenshots if helpful.
    validations:
      required: true
